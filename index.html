<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Аналитика заказов — обзор для руководства</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E🍐%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=9"><script defer src="vendor/vue.global.prod.js"></script><script defer src="vendor/d3.min.js"></script><script defer src="app.js?v=9"></script></head>
<body><div id="app" v-cloak>
<main id="overview">
<div v-if="error" class="error">{{error}}</div><div v-else-if="loading" class="loading">Загружаем данные заказов…</div>
<template v-else><section class="page-heading"><div><div class="eyebrow">ОБЗОР ДЛЯ РУКОВОДСТВА</div><h1>Заказы и покупательское поведение</h1><p>Динамика заказов, расходы покупателей и спрос на товары по всем пользователям.</p></div><button class="button export" @click="exportReport">↓ <span>Скачать отчёт</span></button></section>
<section class="filters"><div class="filter-title"><span>☷</span> Фильтры</div><label>С <input type="month" v-model="from" :min="minMonth" :max="to" @change="selectedMonth=''" aria-label="Начало периода"></label><label>По <input type="month" v-model="to" :min="from" :max="maxMonth" @change="selectedMonth=''" aria-label="Конец периода"></label><label class="select-label"><select v-model="category" @change="selectedMonth=''" aria-label="Категория"><option value="">Все категории</option><option v-for="c in categories" :key="c">{{c}}</option></select></label><label class="select-label"><select v-model="status" aria-label="Статус заказа"><option value="доставлен">Доставленные</option><option value="">Все статусы</option><option value="отменен">Отменённые</option></select></label><button class="reset" @click="reset">↺ Сбросить</button></section>
<div class="period-row"><div class="quick-period"><button :class="{chosen:rangeMode==='24'}" @click="setRange('24')">24 месяца</button><button :class="{chosen:rangeMode==='12'}" @click="setRange('12')">12 месяцев</button><button :class="{chosen:rangeMode==='all'}" @click="setRange('all')">Весь период</button></div><span>{{periodLabel}} <span class="muted">· {{num(summary.orders)}} заказов</span></span><button v-if="selectedMonth" class="month-chip" @click="selectedMonth=''">{{monthLabel(selectedMonth)}} ×</button></div>
<div class="current-period-label"><div><b>{{kpiPeriodLabel}}</b><span class="kpi-period-help">Мини-графики показывают месячную динамику выбранного диапазона</span></div><label class="kpi-mode-control">Карточки за <select v-model="kpiMode" aria-label="Период верхних карточек"><option value="day">Последний день</option><option value="month">Последний месяц</option><option value="period">Весь период</option></select></label></div>
<section ref="kpiCharts" class="kpis"><article class="kpi"><div class="kpi-label">Количество заказов <span class="kpi-icon green">▣</span></div><div class="kpi-value">{{num(currentSummary.orders)}}<span class="unit">{{orderWord(currentSummary.orders)}}</span></div><div class="kpi-change">{{changeLabel('orders')}}</div><div class="sparkline" data-spark="orders"></div><div class="kpi-footer"><template v-if="kpiMode==='period'"><b>{{decimal(summary.orders/monthCount)}}</b> заказов в среднем за месяц</template><template v-else>За выбранный период: <b>{{num(summary.orders)}} заказов</b></template></div></article><article class="kpi"><div class="kpi-label">Сумма трат <span class="kpi-icon peach">₽</span></div><div class="kpi-value">{{num(currentSummary.spend)}}<span class="unit">₽</span></div><div class="kpi-change">{{changeLabel('spend')}}</div><div class="sparkline" data-spark="spend"></div><div class="kpi-footer"><template v-if="kpiMode==='period'"><b>{{money(summary.orders?summary.spend/summary.orders:0)}}</b> {{category ? 'сумма категории на заказ' : 'средний чек'}}</template><template v-else>За выбранный период: <b>{{money(summary.spend)}}</b></template></div></article><article class="kpi"><div class="kpi-label">Средняя скидка <span class="kpi-icon lilac">%</span></div><div class="kpi-value">{{decimal(currentSummary.discountPct)}}<span class="unit">%</span></div><div class="kpi-change">{{changeLabel('discountPct')}}</div><div class="sparkline" data-spark="discountPct"></div><div class="kpi-footer"><template v-if="kpiMode==='period'">Сумма скидок: <b>{{money(summary.saved)}}</b></template><template v-else>За выбранный период: <b>{{decimal(summary.discountPct)}}%</b> · скидки {{money(summary.saved)}}</template></div></article></section>
<section class="chart-grid"><article class="panel trend-panel"><div class="panel-heading"><div><h2>Покупки по месяцам</h2><p>Динамика за {{monthKeys.length}} мес. · переключайте основные метрики</p></div><div class="segmented"><button v-for="m in metrics" :class="{active:metric===m.key}" @click="metric=m.key">{{m.label}}</button></div></div><div class="chart-caption"><span class="legend-dot"></span>{{metricTitle}}<small>Нажмите на месяц для детализации</small></div><div ref="trend" class="trend-chart"></div><div class="chart-foot"><span>{{selectedMonth?'Выбран '+monthLabel(selectedMonth):'Каждая колонка — один месяц'}}</span><span>{{monthCount}} {{monthCount===1?'месяц':'мес.'}} в выборке</span></div></article>
<article id="categories" class="panel categories-panel"><div class="panel-heading"><div><h2>Траты по категориям</h2><p>Сумма и доля в расходах покупателей</p></div><button v-if="category" class="reset" @click="category=''">Все категории</button></div><div class="category-total"><b>{{money(summary.spend)}}</b><span>общая сумма в выборке</span></div><div ref="categoryChart" class="category-chart"></div><div class="chart-foot"><span>Нажмите на категорию для фильтрации</span></div></article></section>
<section id="products" class="panel products-panel"><div class="panel-heading"><div><h2>Спрос на товары <span class="count-badge">{{productStats.length}}</span></h2><p>Лидеры по числу заказов, сумме покупок и количеству единиц</p></div><div class="segmented"><button :class="{active:productMetric==='orders'}" @click="productMetric='orders';page=1">По частоте</button><button :class="{active:productMetric==='spend'}" @click="productMetric='spend';page=1">По тратам</button><button :class="{active:productMetric==='quantity'}" @click="productMetric='quantity';page=1">По количеству</button></div></div><div class="product-tools"><label class="search"><span>⌕</span><input v-model="search" @input="page=1" placeholder="Найти товар…" aria-label="Поиск товара"></label><span>Доставка и упаковка исключены из рейтинга</span></div><div class="product-chart-wrap"><div ref="productChart" class="product-chart"></div></div><div class="product-chart-note"><span>Шкалы штук и рублей независимы; длины сравниваются внутри одной метрики.</span><span>Наведите, нажмите или перейдите Tab к товару — динамика цены.</span></div><div class="table-wrap"><table><thead><tr><th class="rank">№</th><th>Товар</th><th>Частота заказов</th><th class="numeric">Количество</th><th class="numeric">Потрачено</th><th class="numeric">Доля трат¹</th></tr></thead><tbody><tr v-for="(p,i) in visibleProducts" :key="p.name" tabindex="0" @mouseenter="showProductTip($event,p)" @mouseleave="hideTip" @focus="showProductTip($event,p)" @blur="hideTip" @keydown.esc="hideTip"><td class="rank">{{(page-1)*8+i+1}}</td><td><div class="product-name"><span class="product-emoji" :style="{background:emojiBg(p.category)}">{{emoji(p.name,p.category)}}</span><div><b>{{p.name}}</b><small>{{p.category}}</small></div></div></td><td><div class="frequency"><b>{{num(p.orders)}} <small>заказов</small></b><div class="bar-track"><span :style="{width:(p.orders/maxProductOrders*100)+'%'}"></span></div></div></td><td class="numeric">{{num(p.quantity)}} <span class="muted">шт.</span></td><td class="numeric spending">{{money(p.spend)}}</td><td class="numeric muted">{{decimal(goodsSpend?p.spend/goodsSpend*100:0)}}%</td></tr><tr v-if="!visibleProducts.length"><td colspan="6" class="empty">Товары не найдены. Измените фильтры или поисковый запрос.</td></tr></tbody></table></div><div class="table-footer"><span>{{filteredProducts.length?'Показаны '+((page-1)*8+1)+'–'+Math.min(page*8,filteredProducts.length)+' из '+filteredProducts.length+' товаров':'Нет товаров'}}</span><div><button :disabled="page<=1" @click="page--" aria-label="Предыдущая страница">←</button><span>{{page}} / {{pageCount}}</span><button :disabled="page>=pageCount" @click="page++" aria-label="Следующая страница">→</button></div></div></section>
<section class="panel category-metrics"><div class="panel-heading"><div><h2>Категории: основные метрики</h2><p>За выбранный период · нажмите название, чтобы отфильтровать товары</p></div><button v-if="category" class="reset" @click="category=''">Все категории</button></div><div class="table-wrap"><table><thead><tr><th>Категория</th><th class="numeric">Заказы</th><th class="numeric">Количество, шт.</th><th class="numeric">Траты</th><th class="numeric">Средняя скидка</th><th class="numeric">Доля трат</th></tr></thead><tbody><tr v-for="c in categoryStats" :key="c.name"><td><button class="category-name-button" @click="category=category===c.name?'':c.name"><span class="legend-dot" :style="{background:color(c.name)}"></span>{{c.name}}</button></td><td class="numeric">{{num(c.orders)}}</td><td class="numeric">{{num(c.quantity)}}</td><td class="numeric spending">{{money(c.spend)}}</td><td class="numeric">{{decimal(c.discountPct)}}%</td><td class="numeric">{{decimal(summary.spend?c.spend/summary.spend*100:0)}}%</td></tr><tr v-if="!categoryStats.length"><td colspan="6" class="empty">Нет категорий по выбранным фильтрам.</td></tr></tbody></table></div><p class="category-table-note">Один заказ может содержать товары нескольких категорий — количество заказов по категориям не суммируется. В услугах количество отражает единицы доставки и упаковки.</p></section>
<section class="insights"><div class="insight-icon">✦</div><div><h3>Ключевые наблюдения</h3><p v-if="productStats.length">Чаще всего в заказах встречается <b>{{favorite.name}}</b> — в {{num(favorite.orders)}} заказах. Наибольшая сумма покупок приходится на <b>{{biggest.name}}</b>: {{money(biggest.spend)}}.</p><p v-else>В текущей выборке нет покупок товаров.</p></div></section><footer class="page-footer"><span>КОРЗИНА <span>·</span> Аналитика всех пользователей</span><span>{{num(rows.length)}} строк · {{minMonth}} — {{maxMonth}}</span></footer><details class="methodology"><summary>Как считаются метрики</summary><p>Датасет содержит заказы всех пользователей. Идентификатора пользователя в данных нет; метрики описывают совокупное покупательское поведение.</p><p>Заказы — уникальные order_id в выбранной категории и периоде. Траты — сумма amount после скидок, включая услуги. Средняя скидка — средний процент (price − price_discounted) / price, взвешенный по quantity, для строк с положительной ценой. Экономия — discount × quantity. Частота товара — количество уникальных заказов с этим товаром. ¹ Доля трат товара рассчитана от трат на товары, без доставки и упаковки. Период верхних карточек переключается: последний день, последний месяц или вся выбранная выборка. По умолчанию показан последний день с данными в выбранном диапазоне (с учётом выбора месяца), одинаковый для всех категорий и статусов. Если в этот день по выбранным фильтрам заказов нет, карточки показывают нули. Изменение сравнивает день или месяц с предыдущим календарным днём или месяцем с теми же фильтрами; в режиме всего периода сравнение скрыто. По умолчанию отображаются последние 24 месяца датасета. Колонки графика показывают все месяцы диапазона, в том числе месяцы без заказов. Выбор месяца влияет на карточки, категории и товары. Мини-графики в карточках сохраняют динамику всего диапазона. В товарном графике штуки и рубли имеют независимые шкалы, максимум каждой — среди показанных товаров на текущей странице. Цена в тултипе — средняя цена за единицу, взвешенная по quantity: после скидки сумма amount / количество, до скидки сумма price × quantity / количество. История цены относится ко всему выбранному диапазону, даже при детализации одного месяца. Месяцы без покупок оставлены разрывами; цена за них не восстанавливается.</p><p>Отменённые заказы исключены по умолчанию. При выборе всех статусов траты отражают суммы строк, включая отменённые заказы, а не подтверждённые платежи.</p></details></template></main><div ref="tooltip" class="tooltip" role="status" @keydown.esc="hideTip"></div>
</div><noscript>Для просмотра дашборда включите JavaScript.</noscript></body></html>
